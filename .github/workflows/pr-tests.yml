name: PR Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-tests:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm run build
